<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=tab, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

            <tr>

                <th>Name</th>
                <th>Price</th>

            </tr>

            </tr>
            <tr>
                <td>2</td>
                <td>Mobile</td>
                <td>25000</td>
                
            </tr>
            <tr>
                <td>3</td>

                <td>Clothes</td>
            </tr>

        <tfoot align="center">
            <tr>
                <td>Total Price</td>
                <td colspan="3">75500</td>
            </tr>
        </tfoot>
    </table>

</html>
