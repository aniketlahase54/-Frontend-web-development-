<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 700px;
            height: 700px;
            box-shadow: 0px 0px 10px black;
            margin: 40px auto;
            padding: 20px;
        }
 
    </style>
</head>
<body>
    <div id="container">
        <form >
            <label for="username">Enter Username:</label>
            <input id="username" type="text" placeholder="Enter Username" required>
            <br>
            <br>
            <label for="pass">Enter Password:</label>
            <input id="pass" type="password" placeholder="Enter Password" required>
            <br>
            <br>
            <label for="gmail">Enter Gmail:</label>
            <input id="gamil" type="email" placeholder="Enter Gmail">
            <br>
            <br>
            <label for="mobileno">Enter Mobile No:</label>
            <input id="mobileno" type="number" placeholder="Enter Mobile No">
            <br>
            <br>
            <label for="gender">Choose Gender:</label>
            <input id="gender" name="gender" type="radio">Male
            <input id="gender" name="gender" type="radio">Female
            <br>
            <br>
            <label for="course">Choose Course:</label>
            <input id="course" type="checkbox">C
            <input id="course" type="checkbox">C++
            <input id="course" type="checkbox">JAVA
            <input id="course" type="checkbox">PYTHON
            <br>
            <br>
            <label for="color">Favorate Color:</label>
            <input type="color">
            <br>
            <br>
            <label for="dob">Date Of Birth:</label>
            <input type="date">
            <br>
            <br>
            <label for="time">Time:</label>
            <input type="time">
            <br>
            <br>
            <label for="time">Date & Time:</label>
            <input type="datetime-local">
            <br>
            <br>
            <label for="resume">Resume</label>
            <input type="file">
            <br>
            <br>
            <label for="">Choose City:</label>
            <select size="1">
                <option value="pune">Pune</option>
                <option value="mumbai" disabled>Mumbai</option>
                <option value="nashik">Nashik</option>
                <option value="jalgaon" selected>Jalgaon</option>

            </select>
            <br>
            <br>
            <label for="">Choose Course:</label>
            <select>
                <optgroup label="Frontend">
                    <option value="">HTML</option>
                    <option value="">CSS</option>
                    <option value="">JS</option>
                </optgroup>
                <optgroup label="Backend">
                    <option value="">Core Java</option>
                    <option value="">Advance java</option>
                    <option value="">spring Boot</option>
                </optgroup>
                <optgroup label="Database">
                    <option value="">SQL</option>
                    <option value="">MYSQL</option>
                    
                </optgroup>
            </select>
            <br>
            <br>
            <label for="">Choose Course:</label>
            <input list="courses">
            <datalist id="courses">
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="BE">BE</option>
                <option value="ME">ME</option>
                <option value="MCA">MCA</option>
                <option value="BCOM">BCOM</option>
            </datalist>
            <br>
            <br>
            <label for="">Feedback:</label>
            <textarea cols="30" rows="5"></textarea>
            <br>
            <br>
            <input type="submit" value="Register">

        </form>

    </div>

    
</body>
</html>
