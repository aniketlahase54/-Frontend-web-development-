<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #html{
            color: brown;
            font-size: 50px;
        }
        #css{
            color: chartreuse;
            font-size: 30px;
        }
        #a{
            width: 300px;
            height: 300px;
            border : 5px solid black;
        }
        #b{
            width: 500px;
            height: 300px;
            border : 5px solid rgb(209, 21, 21);
        }
    </style>
</head>
<body>
    <h1 id="html">Hello HTML</h1>
    <h1 id="css">Hello CSS</h1>

    <div id="a">HTML</div>
    <div id="b">CSS</div>
</body>
</html>
